name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: build binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$TAG"
          ./scripts/build-release.sh "$TAG"

      - name: smoke test linux amd64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bin="dist/suse-checkin_${TAG}_linux_amd64"
          chmod +x "$bin"
          "$bin" -version
          test "$("$bin" -version)" = "$TAG"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/suse-checkin_* dist/sha256sums.txt --clobber
          else
            gh release create "$TAG" dist/suse-checkin_* dist/sha256sums.txt \
              --title "$TAG" --generate-notes
          fi
